<!-- pages/gallery.html -->
<section data-title="Gallery">
  <header class="mb-4">
    <h3>Gallery</h3>
    <p class="text-sm text-gray-400">Click an image to enlarge. NSFW items are hidden by default.</p>
  </header>

  <!-- NSFW toggle (page JS will wire this up) -->
  <div class="mb-4">
    <button id="nsfw-toggle" type="button"
            class="px-3 py-1 rounded bg-pink-600 text-white focus:outline-none focus:ring">
      Show NSFW
    </button>
  </div>

  <!-- gallery placeholder - gallery.js will fill this -->
  <div id="gallery-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" aria-live="polite">
    <!-- thumbnails inserted here -->
  </div>
</section>
